[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lgtv-mcp"
dynamic = ["version"]
description = "Control LG webOS TVs from MCP clients (Claude, Cursor) and the command line."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hernan Calabrese" }]
requires-python = ">=3.11"
keywords = ["lg", "webos", "tv", "mcp", "model-context-protocol", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.9",
    "aiowebostv>=0.10,<0.11",
    "mcp>=2.2,<3",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/hernanc/lgtv-mcp"
Issues = "https://github.com/hernanc/lgtv-mcp/issues"
Changelog = "https://github.com/hernanc/lgtv-mcp/blob/main/CHANGELOG.md"

[project.scripts]
lgtv = "lgtv_mcp.cli:main"
lgtv-mcp = "lgtv_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.hatch.version]
path = "src/lgtv_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PL", "PT"]
ignore = [
    "ASYNC109",  # timeouts are part of the public API of run() and pair()
    "PLR0911",   # many small returns read better than nesting in validators
    "PLR0913",
    "PLR2004",
    "SIM108",    # nested ternaries read worse than if/else
]

[tool.ruff.lint.per-file-ignores]
"src/lgtv_mcp/server.py" = ["PLR0915"]  # one statement group per tool
"tests/**" = ["S101", "S104", "PLC0415", "PLR0917", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["aiowebostv.*"]
ignore_missing_imports = true
